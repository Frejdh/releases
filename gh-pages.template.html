<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maven Repository Browser</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            color: #24292e;
        }

        header {
            border-bottom: 1px solid #eaecef;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: #0366d6;
        }

        #breadcrumb {
            padding: 10px;
            background-color: #f6f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        #breadcrumb a {
            color: #0366d6;
            text-decoration: none;
        }

        #breadcrumb a:hover {
            text-decoration: underline;
        }

        .file-list {
            list-style: none;
            padding: 0;
        }

        .file-list li {
            padding: 10px;
            border-bottom: 1px solid #eaecef;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .file-list li:hover {
            background-color: #f6f8fa;
        }

        .file-icon {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .dir .file-icon {
            color: #f0c674;
        }

        .file .file-icon {
            color: #859900;
        }

        .file-name {
            flex: 1;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        .file-size {
            color: #6a737d;
            font-size: 14px;
            margin-right: 15px;
        }

        .download-btn {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            pointer-events: none; /* Let the li handle clicks */
        }

        .download-btn:hover {
            background-color: #2c974b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6a737d;
        }

        .error {
            color: #cb2431;
            padding: 20px;
            background-color: #ffeef0;
            border-radius: 6px;
            margin: 20px 0;
        }

        .search-box {
            padding: 8px;
            min-width: 400px;
            max-width: 600px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            font-size: 14px;
        }

        .branch-selector {
            padding: 8px;
            border: 1px solid #e1e4e8;
            min-width: 6rem;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
        }

        .header {
            display: flex;
            flex-direction: column;
        }

        .flex-row {
            display: flex;
            flex-direction: row;
        }

        .flex-column {
            display: flex;
            flex-direction: column;
        }

        .item {
            display: flex;
            width: fit-content;
            height: fit-content;
        }

        .header-group {
            gap: 0.5rem;
        }

        .clickable-row {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .cursor-default {
            cursor: default;
        }
    </style>
</head>
<body>
<header class="header">
    <h1>Repository Browser</h1>
    <p>Browse and download artifacts from the Frejdh repository</p>

    <div class="flex-row header-group">
        <div class="item">
            <select id="branchSelector" class="branch-selector">
                <!-- Generated with the BRANCHES variable -->
            </select>
        </div>
        <div class="item">
            <input type="text" id="searchBox" class="search-box" placeholder="Filter by files and directories...">
        </div>
    </div>


</header>

<div id="breadcrumb"></div>

<div id="loading" class="loading">
    Loading directory contents...
</div>

<div id="error" class="error" style="display: none;"></div>

<ul id="fileList" class="file-list" style="display: none;"></ul>

<script>
    // HARDCODED CONFIGURATION
    // ========================
    // 1. Update this with your GitHub repository
    const REPOSITORY = 'Frejdh/releases';

    // 2. Update this array with your branches
    const BRANCHES = [
        {name: "maven", display: "Maven"}
        // Add more branches like:
        // { name: "releases", display: "releases" },
        // { name: "snapshots", display: "snapshots" }
    ];
    // ========================

    // State
    let currentPath = '';
    let currentBranch = BRANCHES[0].name;
    let currentContents = [];

    // DOM Elements
    const breadcrumbEl = document.getElementById('breadcrumb');
    const fileListEl = document.getElementById('fileList');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const searchBoxEl = document.getElementById('searchBox');
    const branchSelectorEl = document.getElementById('branchSelector');

    // URL State Management
    function updateURL(branch, path) {
        const params = new URLSearchParams();
        if (branch && branch !== BRANCHES[0].name) {
            params.set('branch', branch);
        }
        if (path) {
            params.set('path', path);
        }
        const queryString = params.toString();
        const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
        window.history.pushState({branch, path}, '', newUrl);
    }

    function loadFromURL() {
        const params = new URLSearchParams(window.location.search);
        const branch = params.get('branch') || BRANCHES[0].name;
        const path = params.get('path') || '';

        if (BRANCHES.some(b => b.name === branch)) {
            currentBranch = branch;
            branchSelectorEl.value = branch;
        }
        currentPath = path;
    }

    // Initialize
    function init() {
        // Auto-detect repository from GitHub Pages URL
        autoDetectRepository();

        // Populate branch selector
        populateBranchSelector();

        // Load initial state from URL
        loadFromURL();

        // Load initial directory
        loadDirectory(currentPath);

        // Set up event listeners
        searchBoxEl.addEventListener('input', filterFiles);
        branchSelectorEl.addEventListener('change', changeBranch);

        // Handle browser back/forward buttons
        window.addEventListener('popstate', (event) => {
            if (event.state) {
                currentBranch = event.state.branch || BRANCHES[0].name;
                currentPath = event.state.path || '';
                branchSelectorEl.value = currentBranch;
                loadDirectory(currentPath);
            }
        });
    }

    function autoDetectRepository() {
        // If we're on GitHub Pages, try to extract repo info from URL
        if (window.location.hostname.includes('github.io')) {
            const pathParts = window.location.pathname.split('/').filter(p => p);
            if (pathParts.length >= 2) {
                const owner = pathParts[0];
                const repo = pathParts[1];
                // Update the global REPOSITORY if we can detect it
                window.REPOSITORY = `${owner}/${repo}`;
                console.log(`Auto-detected repository: ${window.REPOSITORY}`);
            }
        }
    }

    function populateBranchSelector() {
        branchSelectorEl.innerHTML = '';
        BRANCHES.forEach(branch => {
            const option = document.createElement('option');
            option.value = branch.name;
            option.textContent = branch.display;
            if (branch.name === currentBranch) {
                option.selected = true;
            }
            branchSelectorEl.appendChild(option);
        });
    }

    function changeBranch() {
        currentBranch = branchSelectorEl.value;
        currentPath = '';
        updateURL(currentBranch, currentPath);
        loadDirectory();
    }

    async function loadDirectory(path = '') {
        try {
            showLoading();
            hideError();

            // Use detected repository or fall back to hardcoded one
            const repo = window.REPOSITORY || REPOSITORY;
            const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${currentBranch}`;

            const response = await fetch(apiUrl);

            /**
             * @type {RepositoryContent[] | GithubError}
             */
            const untypedContents = await parseJsonOrNull(response);

            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('Directory not found');
                }
                /**
                 * @type {GithubError}
                 */
                const contents = untypedContents;
                const message = `${contents?.message ?? ''} ${contents?.documentation_url ? `(${contents?.documentation_url})` : ''}`.trim();
                throw new Error(`HTTP ${response.status}: ${message || response.statusText}`);
            }

            /**
             * @type {RepositoryContent[]}
             */
            const contents = untypedContents;

            // Handle both array (directory) and object (file) responses
            if (Array.isArray(contents)) {
                currentContents = contents;
                currentPath = path;
                updateURL(currentBranch, currentPath);
                renderBreadcrumb();
                renderFileList(contents);
            } else {
                // It's a single file - redirect to raw content
                window.location.href = contents.download_url;
            }
        } catch (error) {
            showError(error.message);
        } finally {
            hideLoading();
        }
    }

    function renderBreadcrumb() {
        const parts = currentPath.split('/').filter(part => part);
        let html = '<span class="cursor-default">📁 </span> <a href="#" onclick="loadDirectory(\'\'); return false;">Root</a>';

        if (parts.length > 0) {
            html += ' / ';
            parts.forEach((part, index) => {
                const path = parts.slice(0, index + 1).join('/');
                html += `<a href="#" onclick="loadDirectory('${path}'); return false;">${part}</a>`;
                if (index < parts.length - 1) {
                    html += ' / ';
                }
            });
        }

        breadcrumbEl.innerHTML = html;
    }

    /**
     *
     * @param response {Response}
     */
    async function parseJsonOrNull(response) {
        try {
            return await response.json();
        } catch (e) {
            console.error(e);
        }
    }

    function renderFileList(contents) {
        // Sort: directories first, then files
        const sortedContents = [...contents].sort((a, b) => {
            if (a.type === b.type) {
                return a.name.localeCompare(b.name);
            }
            return a.type === 'dir' ? -1 : 1;
        });

        fileListEl.innerHTML = '';

        sortedContents.forEach(item => {
            const li = document.createElement('li');
            li.className = item.type;

            // Make entire row clickable
            li.onclick = (e) => {
                // Don't trigger if clicked on breadcrumb or other interactive elements
                if (e.target.tagName === 'A' || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') {
                    return;
                }

                if (item.type === 'dir') {
                    const newPath = currentPath ? `${currentPath}/${item.name}` : item.name;
                    loadDirectory(newPath);
                } else {
                    window.open(item.download_url, '_blank');
                }
            };

            const icon = document.createElement('span');
            icon.className = 'file-icon';
            icon.textContent = item.type === 'dir' ? '📁' : '📄';

            const name = document.createElement('span');
            name.className = 'file-name';
            name.textContent = item.name;

            const size = document.createElement('span');
            size.className = 'file-size';
            size.textContent = item.type === 'file' ? formatFileSize(item.size) : '';

            const action = document.createElement('span');
            action.className = 'download-btn';
            action.textContent = item.type === 'dir' ? 'Open' : 'Download';

            li.appendChild(icon);
            li.appendChild(name);
            li.appendChild(size);
            li.appendChild(action);

            fileListEl.appendChild(li);
        });

        fileListEl.style.display = 'block';
    }

    function filterFiles() {
        const searchTerm = searchBoxEl.value.toLowerCase();

        if (!searchTerm) {
            renderFileList(currentContents);
            return;
        }

        const filtered = currentContents.filter(item =>
                item.name.toLowerCase().includes(searchTerm)
        );

        renderFileList(filtered);
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showLoading() {
        loadingEl.style.display = 'block';
        fileListEl.style.display = 'none';
    }

    function hideLoading() {
        loadingEl.style.display = 'none';
    }

    function showError(message) {
        errorEl.textContent = `Error: ${message}`;
        errorEl.style.display = 'block';
        fileListEl.style.display = 'none';
    }

    function hideError() {
        errorEl.style.display = 'none';
    }

    // Initialize when page loads
    window.addEventListener('DOMContentLoaded', init);

    // Also handle direct URL access on page load
    if (window.location.search) {
        // If there's a query string, parse it immediately
        loadFromURL();
    }
</script>
</body>
</html>
